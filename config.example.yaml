# ──────────────────────────────────────────────────────
# Palimpsest — Configuration
# Copy to config.yaml and fill in your API keys.
# Every field below is actually read by the pipeline.
# ──────────────────────────────────────────────────────

api_keys:
  mathpix:
    app_id: ""
    app_key: ""              # only needed if extraction.engine = "mathpix"
  anthropic:
    api_key: ""              # required for Claude models
  openai:
    api_key: ""              # required for GPT / o-series models

# ── Pipeline ──────────────────────────────────────────

extraction:
  dpi: 400                   # image resolution for PDF → PNG
  engine: "vision"           # "vision" (LLM does OCR, no Mathpix) or "mathpix"

preprocessing:
  deskew: true               # auto-correct page rotation (OpenCV)
  binarize: true             # adaptive binarization for uneven lighting
  denoise: false             # only enable for very noisy scans

rewrite:
  # ── Supported models ──
  # Anthropic: claude-opus-4-20250514, claude-sonnet-4-20250514
  # OpenAI:    o4-mini (best value), gpt-4.1, gpt-4o, o1, gpt-4.1-mini, gpt-4.1-nano
  model: "o4-mini"
  send_source_image: true    # send original image alongside OCR text

# ── Output ────────────────────────────────────────────

output:
  merge_pages: true          # merge all pages into one final document
  include_palimpsest_blurb: true  # cover-page credit + project URL

# ── Performance ───────────────────────────────────────

concurrency:
  extraction_batch_size: 5   # pages OCR'd in parallel
  max_retries: 3
  retry_delay: 2             # seconds between rewrite retries (exp. backoff)

# ── Cache ─────────────────────────────────────────────

cache:
  enabled: true              # resume interrupted runs
  directory: ".cache"

# ──────────────────────────────────────────────────────
# Optional runtime hardening (read from environment):
#   PALIMPSEST_API_TOKEN          require this header on /api/upload
#   PALIMPSEST_MAX_UPLOAD_MB      reject uploads above N MB (default 60)
#   PALIMPSEST_ALLOWED_ORIGINS    csv allowlist for WebSocket Origin
#   PALIMPSEST_UPLOAD_RETENTION_DAYS   purge uploads older than N days
# ──────────────────────────────────────────────────────
