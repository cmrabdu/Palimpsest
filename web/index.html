<!doctype html>
<!--
  \documentclass[mystique]{palimpsest}
  % You are reading the HTML source.
  % Welcome backstage.
  % The real document lies elsewhere — beneath the surface.
-->
<html lang="en" data-theme="default">
<head>
  <meta charset="utf-8">
  <title>Palimpsest — scan → ocr → llm → LaTeX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1e7d0">
  <meta name="description" content="Drop a scanned PDF, get a clean scientific LaTeX document back.">
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Palimpsest — scan → ocr → llm → LaTeX">
  <meta property="og:description" content="Drop your old scan, get a clean scientific document back.">
  <meta property="og:image" content="/brand/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Palimpsest — scan → ocr → llm → LaTeX">
  <meta name="twitter:description" content="Drop your old scan, get a clean scientific document back.">
  <meta name="twitter:image" content="/brand/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400;1,500;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/workshop.css">
  <style>
    body { overflow-x: hidden; }
    /* toast (lifted from old design, restyled to paper) */
    .toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: var(--paper);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.04em;
      padding: 10px 18px;
      border-radius: 3px;
      box-shadow: 2px 2px 0 var(--ochre-deep), 0 12px 24px -10px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms, transform 200ms;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="/assets/components.jsx"></script>
  <script type="text/babel" src="/assets/workshop.jsx"></script>
  <script type="text/babel" src="/assets/workshop-mobile.jsx"></script>

  <script>
    // PDF.js worker
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    function showToast(msg, ms = 3200) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window._toastT);
      window._toastT = setTimeout(() => el.classList.remove('show'), ms);
    }
    window.showToast = showToast;
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ─── Stage normalization for log lines ───
    function logEntry(page, total, stage) {
      const tone = stage.startsWith('rewrite (cached)') || stage.includes('cached') ? 'ok' : 'act';
      const glyph = stage.includes('cached') ? '✓' : '◐';
      const s = stage.toLowerCase();
      let label = 'pipeline';
      if (s.startsWith('pre'))     label = 'preprocess';
      else if (s.startsWith('ocr'))     label = 'ocr';
      else if (s.startsWith('rewrite')) label = 'rewrite';
      else if (s.startsWith('compile')) label = 'compile';
      const time = formatTime();
      return {
        time, glyph,
        stage: label,
        msg: total ? `p${String(page).padStart(2,'0')} · ${stage}` : stage,
        tone,
      };
    }

    function formatTime() {
      const d = new Date();
      const m = String(d.getMinutes()).padStart(2, '0');
      const s = String(d.getSeconds()).padStart(2, '0');
      return `${m}:${s}`;
    }

    function App() {
      // ── job lifecycle state ─────────────────────────────────────
      const [state, setState]         = useState('idle');         // 'idle' | 'processing' | 'done' | 'error'
      const [jobId, setJobId]         = useState(null);
      const [page, setPage]           = useState(0);
      const [total, setTotal]         = useState(0);
      const [stage, setStage]         = useState('preprocessing');
      const [log, setLog]             = useState([{
        time: '00:00', glyph: '•', stage: 'workshop', msg: 'palimpsest 0.6.2 — ready', tone: '',
      }, {
        time: '00:00', glyph: '•', stage: 'workshop', msg: 'awaiting input · drop a PDF in bay 01', tone: '',
      }]);
      const [hasPdf, setHasPdf]       = useState(true);
      const [errorMsg, setErrorMsg]   = useState(null);
      const [wsConnected, setWsConnected] = useState(false);

      // ── upload-side state ────────────────────────────────────────
      const [file, setFile]           = useState(null);
      const [pageCount, setPageCount] = useState(null);
      const [flash, setFlash]         = useState(false);
      const [uploading, setUploading] = useState(false);

      const [cfg, setCfg] = useState({
        model: 'o4-mini',
        ocr:   'vision',
        src:   'preserve images',
      });

      const wsRef               = useRef(null);
      const reconnectTimerRef   = useRef(null);
      const jobFinishedRef      = useRef(false);

      const cost = useMemo(() => {
        if (!pageCount) return null;
        return window.estimateCost(cfg, pageCount);
      }, [cfg, pageCount]);

      // canStart accepts any "not-currently-running" state — including
      // 'done' and 'error' — so the user can immediately process another PDF
      // after finishing/failing the first one.
      const canStart = !!file && state !== 'processing' && !uploading;

      // ── reset everything visible in the terminal/right pane ────────
      const resetTerminal = useCallback(() => {
        // Close any open WS and stop reconnect attempts
        if (wsRef.current) { try { wsRef.current.close(); } catch {} }
        wsRef.current = null;
        if (reconnectTimerRef.current) clearTimeout(reconnectTimerRef.current);
        jobFinishedRef.current = true; // prevents auto-reconnect of the prior socket

        setJobId(null);
        setState('idle');
        setPage(0);
        setTotal(0);
        setStage('preprocessing');
        setErrorMsg(null);
        setHasPdf(true);
        setLog([]);
        setWsConnected(false);
      }, []);

      // ── file picker ──────────────────────────────────────────────
      const onPick = useCallback(async (f) => {
        if (!f.name.toLowerCase().endsWith('.pdf')) {
          showToast('⚠ PDF required');
          return;
        }
        // Picking a new file = fresh run. Clear the terminal so the UI is
        // ready to start a new pipeline (fixes the "stuck after first job"
        // bug where state stayed at 'done').
        resetTerminal();

        setFile(f);
        setPageCount(null);
        setFlash(true);
        setTimeout(() => setFlash(false), 260);
        try {
          const buf = await f.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
          setPageCount(pdf.numPages);
        } catch (e) {
          // fallback estimate
          setPageCount(Math.max(1, Math.round(f.size / 400_000)));
        }
      }, [resetTerminal]);

      const onClear = useCallback((e) => {
        e?.stopPropagation();
        setFile(null);
        setPageCount(null);
        resetTerminal();
      }, [resetTerminal]);

      // ── start pipeline ───────────────────────────────────────────
      const onStart = useCallback(async () => {
        if (!file) return;
        setUploading(true);
        const fd = new FormData();
        fd.append('file', file);
        fd.append('model', cfg.model);
        fd.append('send_image', cfg.src === 'preserve images' ? 'true' : 'false');
        fd.append('engine', cfg.ocr);
        let data;
        try {
          const res = await fetch('/api/upload', { method: 'POST', body: fd });
          data = await res.json();
        } catch (err) {
          showToast('❌ network error');
          setUploading(false);
          return;
        }
        if (data.error) {
          showToast('❌ ' + data.error);
          setUploading(false);
          return;
        }
        setUploading(false);
        startTracking(data.job_id, file.name);
      }, [file, cfg]);

      // ── connect to a job (new or resumed) ────────────────────────
      const connectWs = useCallback((id) => {
        if (reconnectTimerRef.current) clearTimeout(reconnectTimerRef.current);
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${proto}//${location.host}/ws/${id}`);
        wsRef.current = ws;
        ws.onopen = () => setWsConnected(true);
        ws.onclose = () => {
          setWsConnected(false);
          // Auto-reconnect while the job is still running (Cloudflare timeout, etc.)
          if (!jobFinishedRef.current) {
            reconnectTimerRef.current = setTimeout(() => connectWs(id), 2000);
          }
        };
        ws.onerror = () => setWsConnected(false);
        ws.onmessage = ({ data }) => {
          let d; try { d = JSON.parse(data); } catch { return; }
          if (d.type === 'ping') return; // server keepalive — ignore
          if (d.type === 'progress') {
            setPage(d.page);
            setTotal(d.total);
            setStage(d.stage || 'preprocessing');
            setLog(L => [...L, logEntry(d.page, d.total, d.stage || '')]);
          } else if (d.type === 'done') {
            jobFinishedRef.current = true;
            setState('done');
            setHasPdf(d.has_pdf !== false);
            setLog(L => [...L, {
              time: formatTime(), glyph: '✓', stage: 'done',
              msg: d.has_pdf === false ? '.tex ready — pdf compile failed' : 'pdf + .tex ready',
              tone: 'ok',
            }]);
            try { ws.close(); } catch {}
          } else if (d.type === 'error') {
            jobFinishedRef.current = true;
            setState('error');
            setErrorMsg(d.message || 'pipeline halted');
            setLog(L => [...L, {
              time: formatTime(), glyph: '!', stage: 'halted',
              msg: d.message || 'pipeline halted',
              tone: 'err',
            }]);
            try { ws.close(); } catch {}
          } else if (d.type === 'status') {
            // initial snapshot when reconnecting
            if (d.filename) {
              setFile(f => f || { name: d.filename, size: 0 });
            }
            if (d.total) setTotal(d.total);
            if (d.progress) setPage(d.progress);
            if (d.stage) setStage(d.stage);
            if (d.status === 'done') {
              jobFinishedRef.current = true;
              setState('done');
              setHasPdf(d.has_pdf !== false);
            } else if (d.status === 'error') {
              jobFinishedRef.current = true;
              setState('error');
              setErrorMsg(d.error || 'pipeline halted');
            } else if (d.status === 'processing' || d.status === 'queued') {
              setState('processing');
            }
          }
        };
      }, []);

      const startTracking = useCallback((id, filename) => {
        setJobId(id);
        setState('processing');
        setPage(0);
        setTotal(pageCount || 0);
        setStage('preprocessing');
        setErrorMsg(null);
        jobFinishedRef.current = false;
        setLog([{
          time: formatTime(), glyph: '•', stage: 'open',
          msg: `${filename || id} — ${pageCount ? `${pageCount} pages` : 'starting'}`,
          tone: '',
        }]);
        // close any prior socket
        if (wsRef.current) { try { wsRef.current.close(); } catch {} }
        connectWs(id);
      }, [pageCount, connectWs]);

      // ── resume in-flight job from URL ?job=… ─────────────────────
      useEffect(() => {
        const params = new URLSearchParams(location.search);
        const id = params.get('job');
        if (id) {
          // optimistic — pull latest status
          fetch(`/api/jobs/${id}`)
            .then(r => r.json())
            .then(j => {
              if (!j || j.error) {
                showToast('⚠ job ' + id + ' not found');
                return;
              }
              startTracking(id, j.filename);
              // sync cfg from server-side record
              if (j.model)  setCfg(c => ({ ...c, model: j.model }));
              if (j.engine) setCfg(c => ({ ...c, ocr: j.engine }));
              setCfg(c => ({ ...c, src: j.send_image === false ? 'text only' : 'preserve images' }));
            })
            .catch(() => showToast('⚠ cannot resume job'));
        }
        return () => {
          if (reconnectTimerRef.current) clearTimeout(reconnectTimerRef.current);
          if (wsRef.current) { try { wsRef.current.close(); } catch {} }
        };
      // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []);

      // ── theme: parchment via konami code ─────────────────────────
      useEffect(() => {
        const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
        let ki = 0, pn = false;
        const onKey = (e) => {
          ki = e.key === KONAMI[ki] ? ki + 1 : (e.key === KONAMI[0] ? 1 : 0);
          if (ki === KONAMI.length) {
            ki = 0; pn = !pn;
            document.documentElement.setAttribute('data-theme', pn ? 'parchment' : 'default');
            const tc = document.querySelector('meta[name="theme-color"]');
            if (tc) tc.content = pn ? '#1c1409' : '#f1e7d0';
            showToast(pn ? '📜 Parchment mode' : '◆ Default mode');
          }
        };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, []);

      // ── logo click ×5 → secret poem ──────────────────────────────
      useEffect(() => {
        let lc = 0, lt;
        const onClick = (e) => {
          if (!e.target.closest('#logo')) return;
          lc++;
          clearTimeout(lt);
          lt = setTimeout(() => { lc = 0; }, 2200);
          if (lc >= 5) {
            lc = 0;
            console.log(
              '%c\n  \\documentclass[secret]{palimpsest}\n  \\begin{poem}\n    Beneath each glyph lies\n    the ink of another text.\n    You read the present —\n    but the past bleeds through.\n  \\end{poem}\n',
              'color:#5c7bff;font-family:monospace;font-size:11px;line-height:1.7'
            );
            showToast('📜 look in the console…', 4000);
          }
        };
        document.addEventListener('click', onClick);
        return () => document.removeEventListener('click', onClick);
      }, []);

      const shared = {
        state, page, total, currentStage: stage, log, jobId,
        file, pageCount, cfg, setCfg, cost, wsConnected, hasPdf, errorMsg,
        onPick, onClear, onStart, flash, canStart, uploading,
      };

      return (
        <>
          <Workshop {...shared} />
          <MobileWorkshop {...shared} />
        </>
      );
    }

    // wait for Babel-compiled scripts to register globals
    function boot() {
      if (!window.Workshop || !window.MobileWorkshop) {
        return setTimeout(boot, 30);
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }
    boot();
  </script>
</body>
</html>
